name: Build Release (Android / Windows / macOS)

# 触发方式：
#   1) 推送 tag（如 v1.0.0）→ 自动构建并发布到 GitHub Releases
#   2) 手动触发（Actions 页面 Run workflow，可填版本号）
#
# 需要的仓库 Secrets（Android 正式签名，缺失时回退 debug 签名并仅在本地开发可用）：
#   KEYSTORE_BASE64    release.keystore 的 base64（keytool 生成）
#   KEYSTORE_PASSWORD  keystore 密码
#   KEY_ALIAS          密钥别名
#   KEY_PASSWORD       密钥密码
#
# 生成 keystore 示例：
#   keytool -genkey -v -keystore release.keystore -alias moneyfly \
#     -keyalg RSA -keysize 2048 -validity 10000 -storetype JKS
#   base64 -i release.keystore | pbcopy   # 填入 KEYSTORE_BASE64
#
# 内核（SINGBOX_VERSION）：官方 SagerNet/sing-box 预编译 release。
#   - 桌面端（Windows/macOS）构建时直接下载官方编译好的二进制内置进安装包；
#   - Android：官方没有可嵌入 VpnService 的 .so/.aar，故由 moneyfly004/sing-box-lib
#     发布仓库负责「官方源码 + gomobile bind 预编译」（每日自动跟随官方新版，
#     无 fork），本 workflow 只做秒级下载，不每次现编内核。
# 离线分流规则：SagerNet/sing-geosite + sing-geoip（geosite-cn.srs / geoip-cn.srs）。
#
# ── 构建耗时优化（依据一次真实成功运行的逐步骤耗时）────────────────────────
# 实测基线（run 35437578421，全绿；关键路径 = Android 9.70min）：
#   Android 9.70 / macOS arm64 7.47 / macOS universal 6.82 / Windows 6.67
#   / macOS x64 6.28 / iOS 3.52 / release 0.52
#   Android 内部：测试 134s、构建 APK 337s、构建 AAB 62s
#   macOS/Windows 内部：测试 133~190s（这些 job 原本用 --concurrency=1 全量串行）
# 四类优化：
#   1) 测试拆分：`--concurrency=1` 的由来见 a29324e ——「两个真实内核测试并行会抢
#      2080/9090 端口」。现在用 dart_test.yaml 的 e2e 标签把那几个「真实内核 /
#      固定端口 / 真实系统代理」用例单独串行（`--tags e2e --concurrency=1`），
#      其余几百个纯单元/widget 测试用默认并发（runner 核数）跑
#      （`--exclude-tags e2e`）→ 测试步骤 133~190s → 约 60~80s。
#      ubuntu 上「全量并行 + 真实内核」本来就被 ci.yml 验证为绿。
#   2) Android Gradle 依赖缓存（setup-java cache: gradle）：APK 构建 337s 里有
#      相当一部分是冷缓存重下 AGP/Kotlin/依赖（实测 337s → 313s，预热后更好）。
#   2b) Android 拆成三个并行 job：verify（ubuntu 全量测试）/ android（仅 APK）/
#      android-aab（仅 AAB）。原来「测试 98s + APK 313s + AAB 59s」串在同一个
#      runner 上 = 9.4min 的关键路径；拆开后关键路径只剩 APK 那一段。
#   2c) 平台校验与构建分离：Windows / macOS 各自多一个 verify-* job 跑平台测试，
#      构建 job 专心构建。实测 Windows 测试 92~207s、macOS arm64 测试 174~211s，
#      串在构建前等于把关键路径拉长同样多；拆开后关键路径只剩「构建+打包」。
#      macOS 那台 3 核 runner 用一次性 `--concurrency=1`（拆两次调用要重编测试
#      bundle，实测 237s > 174s），Windows 那台核多，用「并行 + e2e 串行」更快。
#   3) macOS 内核不再下载两次：测试用的那份直接复用给「内置内核」步骤
#      （实测最慢一次这个重复下载花了 51s）。
#   4) macOS x64 / universal 两个 job 不再重复跑全量测试（同一份 Dart 代码，
#      arm64 job 已全量验证）：只跑 e2e 组 —— x64 保住它唯一独有的信号
#      「amd64 compatible 内核能在 Rosetta 下真跑起来」（历史上正是这里翻过车），
#      universal 同样只跑 e2e 组。
# 另加：同 ref 的新运行自动取消旧的（concurrency）、每个 job 设 timeout 避免卡死
#      白等；Windows 里那个永远被 if 跳过的 Rosetta 死步骤已删除。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0，留空则用 pubspec）'
        required: false
        default: ''

# 同一个 ref 上连续推 tag / 反复手动触发时，取消上一次没跑完的运行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4' # 与开发机一致，保证构建可复现
  SINGBOX_VERSION: '1.14.4' # sing-box 官方内核版本（桌面二进制 + iOS 框架）
  SINGBOX_LIB_VERSION: '1.14.0' # Android AAR（moneyfly004/sing-box-lib 的 release tag）

jobs:
  # ================= Linux 校验（唯一一次 ubuntu 全量测试） =================
  # 为什么单独立一个 job：ubuntu 上的测试是纯 Dart/widget 测试，与产物 job 无关。
  # 原来它挂在 Android job 里（98s），而 Android job 恰好是关键路径最长的一个 ——
  # 挪出来并行跑，关键路径直接少掉这一段。
  verify:
    name: 校验 (analyze + test / ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 依赖
        run: flutter pub get
      - name: 下载离线分流数据（assets 声明依赖，缺失会导致测试失败）
        run: |
          bash tool/fetch_ruleset.sh
      # 与 ci.yml 同一套命令（本 job 无内核二进制，e2e 组本来就会 skip；真实内核
      # e2e 由 Windows / macOS arm64 / macOS x64 job 负责，那些平台才有内核）
      - name: 校验
        run: |
          flutter analyze
          flutter test --exclude-tags e2e

  # ================= macOS 平台校验（真实内核 e2e + macOS 分支用例） ==========
  # 为什么在 macOS 上再跑一遍全量：不少用例按 Platform.isMacOS 分支（系统代理、
  # 单实例锁、autostart、TUN 提权……），只在 Linux 上跑等于没验证这些分支。
  # 单次 `--concurrency=1`：这台 runner 只有 3 核，拆成「并行 + e2e 串行」两次调用
  # 要重新编译一遍测试 bundle，实测 237s > 174s，不划算。
  verify-macos:
    name: 校验 (macOS arm64, 真实内核)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 依赖
        run: flutter pub get
      - name: 下载离线分流数据
        run: |
          bash tool/fetch_ruleset.sh
      - name: 下载 sing-box 内核（真实内核 e2e 用）
        run: |
          mkdir -p build/singbox
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o sb.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v$SINGBOX_VERSION/sing-box-$SINGBOX_VERSION-darwin-arm64.tar.gz"
          tar -xzf sb.tar.gz
          cp "$(find . -maxdepth 3 -type f -name sing-box | head -1)" build/singbox/sing-box
          chmod +x build/singbox/sing-box
      - name: 校验
        run: |
          export MONEYFLY_SINGBOX="$PWD/build/singbox/sing-box"
          flutter analyze
          flutter test --concurrency=1

  # ================= Windows 平台校验（真实内核 e2e + Windows 分支用例） ==========
  # Windows 分支（注册表系统代理、单实例互斥、launch_at_startup）同样只能在
  # Windows 上验证；这台 runner 核多，测试拆成「并行 + e2e 串行」反而更快
  # （实测 133s → 92s）。
  verify-windows:
    name: 校验 (Windows, 真实内核)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 依赖
        run: flutter pub get
      - name: 下载离线分流数据
        shell: bash
        run: |
          bash tool/fetch_ruleset.sh
      - name: 下载 sing-box 内核（真实内核 e2e 用）
        shell: bash
        run: |
          mkdir -p build/singbox
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o sb.zip \
            "https://github.com/SagerNet/sing-box/releases/download/v$SINGBOX_VERSION/sing-box-$SINGBOX_VERSION-windows-amd64.zip"
          unzip -o sb.zip -d sb
          EXE=$(find sb -iname "sing-box.exe" | head -1)
          [ -n "$EXE" ] && cp "$EXE" build/singbox/sing-box.exe || { echo "zip 内未找到 sing-box.exe"; exit 1; }
      - name: 校验（非 e2e 并行 + 真实内核 e2e 串行）
        shell: bash
        run: |
          export MONEYFLY_SINGBOX="$PWD/build/singbox/sing-box.exe"
          flutter analyze
          flutter test --exclude-tags e2e
          flutter test --tags e2e --concurrency=1

  # ================= macOS x64 校验（Rosetta + amd64-compatible 内核） ==========
  # 这个 job 提供两个别处都没有的信号：
  #   1) amd64 compatible 内核能在 Rosetta 下真的跑起来（历史上正是这里翻过车）；
  #   2) x86_64 产物链路的真实内核 e2e。
  # 只跑 e2e 组：全量 Dart 测试已由 verify-macos（arm64）与 verify（ubuntu）覆盖，
  # 在 Rosetta 下再串行跑一遍全量要多花约 157s 而没有新信号。
  verify-macos-x64:
    name: 校验 (macOS x64/Rosetta, 真实内核)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 安装 Rosetta 2
        run: |
          if ! arch -x86_64 true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi
      - name: 依赖
        run: flutter pub get
      - name: 下载离线分流数据
        run: |
          bash tool/fetch_ruleset.sh
      - name: 下载 sing-box 内核（Rosetta/x64 用官方 amd64 构建）
        run: |
          mkdir -p build/singbox
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o sb.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v$SINGBOX_VERSION/sing-box-$SINGBOX_VERSION-darwin-amd64.tar.gz"
          tar -xzf sb.tar.gz
          cp "$(find . -maxdepth 3 -type f -name sing-box | head -1)" build/singbox/sing-box
          chmod +x build/singbox/sing-box
      - name: 校验（真实内核 e2e，串行）
        run: |
          export MONEYFLY_SINGBOX="$PWD/build/singbox/sing-box"
          flutter analyze
          flutter test --tags e2e --concurrency=1

  # ================= Android：多 ABI 分版本 =================
  android:
    name: Android APK (armeabi-v7a / arm64-v8a / x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Gradle 依赖缓存：APK+AAB 是关键路径最大的一块，冷缓存要重下
          # AGP/Kotlin/依赖
          cache: gradle

      - name: 下载离线分流数据（构建时从 GitHub 拉最新，不在仓库里存二进制）
        run: |
          bash tool/fetch_ruleset.sh
          ls -lh assets/rules/

      # ---- libmoneyfly.aar：从 sing-box-lib 发布仓库下载（官方源码预编译，无需每次现编）。
      #      编译与自动跟随官方新版由 moneyfly004/sing-box-lib 的 workflow 负责。----
      - name: 下载 libmoneyfly.aar（sing-box-lib 预编译发布 v${{ env.SINGBOX_LIB_VERSION }}）
        run: |
          mkdir -p android/app/libs
          mkdir -p android/app/libs
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o android/app/libs/libmoneyfly.aar \
            "https://github.com/moneyfly004/sing-box-lib/releases/download/v$SINGBOX_LIB_VERSION/libmoneyfly-$SINGBOX_LIB_VERSION.aar"
          ls -lh android/app/libs/libmoneyfly.aar

      - name: 依赖
        run: flutter pub get

      - name: 构建多 ABI APK（适配不同机型架构；obfuscate 混淆再省 ~10% 体积）
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols --obfuscate
        env:
          # 正式签名密钥（缺失则 build.gradle.kts 回退 debug）。
          # 必须在此注入，否则 Gradle 读不到 → 每次构建用临时 debug 签名 →
          # 版本间签名不一致，用户无法覆盖升级、必须卸载重装。
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 重命名产物
        run: |
          V=${{ github.event.inputs.version || github.ref_name }}
          V=${V#v}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/MoneyFly-android-armeabi-v7a-$V.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk  dist/MoneyFly-android-arm64-v8a-$V.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk  dist/MoneyFly-android-x86_64-$V.apk
          # 校验和文件名必须按 job 区分：旧实现 android 与 windows 都写
          # SHA256SUMS.txt，release job 用 merge-multiple 下载时互相覆盖 ——
          # 实测 v2.2.9 的 SHA256SUMS.txt 里只有 4 个 Android 条目，Windows 的
          # exe/zip 一直没有校验和覆盖。
          cd dist && sha256sum * > SHA256SUMS-android-apk.txt

      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-android
          path: dist/

  # AAB 单独一个 job：它和 APK 都要各做一遍 Dart AOT + R8，串在同一个 runner 上
  # 让关键路径白白多出 59s（实测）。拆到两个 runner 并行后，AAB 不再占关键路径。
  android-aab:
    name: Android AAB (应用商店备用)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: 下载离线分流数据
        run: |
          bash tool/fetch_ruleset.sh
      - name: 下载 libmoneyfly.aar（sing-box-lib 预编译发布 v${{ env.SINGBOX_LIB_VERSION }}）
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o android/app/libs/libmoneyfly.aar \
            "https://github.com/moneyfly004/sing-box-lib/releases/download/v$SINGBOX_LIB_VERSION/libmoneyfly-$SINGBOX_LIB_VERSION.aar"
      - name: 依赖
        run: flutter pub get
      - name: 构建 AAB（应用商店备用）
        run: flutter build appbundle --release --split-debug-info=build/symbols --obfuscate
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: 重命名产物
        run: |
          V=${{ github.event.inputs.version || github.ref_name }}
          V=${V#v}
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab dist/MoneyFly-android-$V.aab
          cd dist && sha256sum * > SHA256SUMS-android-aab.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-android-aab
          path: dist/

  # ================= Windows：exe 安装包 + zip 便携版 =================
  windows:
    name: Windows (exe 安装包 + zip 便携版)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 下载离线分流数据
        shell: bash
        run: |
          bash tool/fetch_ruleset.sh
          ls -lh assets/rules/

      # ---- 先下载内核：让 flutter test 真实启动内核做端到端验证 ----
      - name: 下载 sing-box 内核（官方预编译）
        shell: bash
        run: |
          mkdir -p build/singbox
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o sb.zip \
            "https://github.com/SagerNet/sing-box/releases/download/v$SINGBOX_VERSION/sing-box-$SINGBOX_VERSION-windows-amd64.zip"
          unzip -o sb.zip -d sb
          # 官方 zip 内为 sing-box-<ver>-windows-<arch>/sing-box.exe
          EXE=$(find sb -iname "sing-box.exe" | head -1)
          [ -n "$EXE" ] && cp "$EXE" build/singbox/sing-box.exe || { echo "zip 内未找到 sing-box.exe"; exit 1; }
          ls -la build/singbox/

      # 测试已移到 verify-windows job（并行跑）：实测这个 runner 上测试要 92~207s，
      # 串在构建前面就等于把关键路径拉长同样多。真实内核也在那边下载并验证 ——
      # 本 job 保留内核下载只是为了「内嵌进安装包」。
      - name: 构建 Windows release
        run: flutter build windows --release

      # ---- 内核放入 exe 同目录（安装包/zip 随 App 分发）----
      - name: 内置 sing-box 内核
        shell: bash
        run: |
          RELEASE_DIR="build/windows/x64/runner/Release"
          cp build/singbox/sing-box.exe "$RELEASE_DIR/sing-box.exe"
          ls -la "$RELEASE_DIR/sing-box.exe"

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 打包（exe 安装包 + zip 便携版）
        shell: bash
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          V="${V#v}"
          RELEASE_DIR="build/windows/x64/runner/Release"
          mkdir -p dist

          # zip 便携版（解压即用）——powershell 需要 Windows 路径
          WIN_RELEASE_DIR=$(cygpath -w "$(pwd)/$RELEASE_DIR")
          WIN_DIST=$(cygpath -w "$(pwd)/dist")
          powershell -Command "Compress-Archive -Path '$WIN_RELEASE_DIR\*' -DestinationPath '$WIN_DIST\MoneyFly-windows-x64-portable-$V.zip' -Force"

          # Inno Setup 安装版（开始菜单/桌面快捷方式/卸载器）
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DVERSION="$V" //DBUILD_DIR="$WIN_RELEASE_DIR" scripts/windows_installer.iss

          # 校验和文件名按 job 区分（见 APK job 的说明）
          cd dist && sha256sum * > SHA256SUMS-windows.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      # 停止线：产物里不得含真实/测试节点信息。
      # 源码侧由 test/no_test_node_data_test.dart 拦（跑在前面）；这一步拦的是
      # 「源码干净但构建期被塞进产物」的路径——构建脚本下载、CI 变量注入、
      # 第三方内核夹带。命中直接 fail，产物不会进 Release。
      #
      # exe 是 Inno Setup 包：**7-Zip 解不了**（只认 NSIS/普通归档），必须用
      # innoextract，否则脚本会因"解不开"判失败（这是有意的：没扫到 ≠ 干净）。
      - name: 安装 innoextract（解 Inno Setup 安装包用）
        shell: bash
        run: choco install innoextract --no-progress -y

      - name: 扫描产物（不得含测试/真实节点信息）
        shell: bash
        env:
          # Windows runner 的 Python 默认输出编码是 cp1252，脚本输出全是中文，
          # 不指定 UTF-8 会在**扫描之前**抛 UnicodeEncodeError 直接失败（踩过）。
          # 脚本内部也做了 stdout.reconfigure 兜底，这里是双保险。
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          # Windows runner 上 python3 不一定在 PATH（用 python），两种都试一次
          PY="$(command -v python3 || command -v python)"
          "$PY" tool/scan_release_artifacts.py \
            dist/MoneyFly-windows-x64-portable-*.zip \
            dist/MBox-setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-windows
          path: dist/

  # ================= macOS：universal + arm64(Apple) + x64(Intel) =================
  # 说明：
  #  - GitHub 公共 Intel runner(macos-13) 队列极长，故 x64 在 Apple Silicon runner
  #    用 Rosetta 执行整条 x86_64 构建链（arch -x86_64 flutter build），
  #    产物为纯 x86_64，快照/引擎自洽（不做 universal→thin 裁剪）。
  #  - sing-box 官方 darwin-amd64 构建为通用 x86_64，Rosetta/老 Intel 均可运行，
  #    故 x64 用官方 compatible 版内核。
  #  - universal = lipo 合并 arm64 与 x64 两份 app（scripts/merge_macos_universal.sh）。
  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # CocoaPods 缓存：flutter build macos 内部会 pod install，冷缓存要重下 spec/pods
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('macos/Podfile') }}
          restore-keys: pods-${{ runner.os }}-
      - name: 依赖
        run: flutter pub get
      - name: 下载离线分流数据
        run: |
          bash tool/fetch_ruleset.sh
      - name: 下载 sing-box 内核（测试与内嵌共用同一份 arm64 内核）
        run: |
          mkdir -p build/singbox
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o sb.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v$SINGBOX_VERSION/sing-box-$SINGBOX_VERSION-darwin-arm64.tar.gz"
          tar -xzf sb.tar.gz
          cp "$(find . -maxdepth 3 -type f -name sing-box | head -1)" build/singbox/sing-box
          chmod +x build/singbox/sing-box
      # 测试已移到 verify-macos job（并行跑）。本 job 只下载内核用于「内嵌」。
      - name: 构建 macOS（arm64）
        run: flutter build macos --release
      - name: 校验架构
        run: lipo build/macos/Build/Products/Release/MBox.app/Contents/MacOS/MBox -verify_arch arm64
      - name: 内置 sing-box 内核（复用上面已下载的 arm64 内核，不再重复下载）
        run: |
          APP="build/macos/Build/Products/Release/MBox.app"
          cp build/singbox/sing-box "$APP/Contents/MacOS/sing-box"
          chmod +x "$APP/Contents/MacOS/sing-box"
          lipo "$APP/Contents/MacOS/sing-box" -verify_arch arm64
      - name: 打包 arm64 DMG
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"; V="${V#v}"
          APP="build/macos/Build/Products/Release/MBox.app"; mkdir -p dist
          STAGE="build/dmg-stage-arm64"; rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/MBox.app" && ln -s /Applications "$STAGE/Applications"
          cp scripts/uninstall_macos.command "$STAGE/uninstall.command" && chmod +x "$STAGE/uninstall.command"
          # 「已损坏，无法打开」的修复脚本：手动（浏览器）下载安装的用户一旦遇到
          # Gatekeeper 拦截，双击这个脚本即可清掉隔离属性
          cp scripts/fix_quarantine_macos.command "$STAGE/修复已损坏.command" && chmod +x "$STAGE/修复已损坏.command"
          codesign --force --deep -s - --entitlements macos/Runner/Release.entitlements "$STAGE/MBox.app"
          hdiutil create -volname MoneyFly -srcfolder "$STAGE" -ov -format UDZO "dist/MoneyFly-macos-arm64-$V.dmg"
          cd dist && shasum -a 256 MoneyFly-macos-arm64-$V.dmg > SHA256SUMS-macos-arm64.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-macos-arm64
          path: |
            dist/MoneyFly-macos-arm64-*.dmg
            dist/SHA256SUMS-macos-arm64.txt

  macos-x64:
    name: macOS x64 (Intel)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('macos/Podfile') }}
          restore-keys: pods-${{ runner.os }}-
      - name: 安装 Rosetta 2
        run: |
          if ! arch -x86_64 true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi
      - name: 依赖
        run: flutter pub get
      - name: 下载离线分流数据
        run: |
          bash tool/fetch_ruleset.sh
      - name: 下载 sing-box 内核（测试与内嵌共用同一份 x64 内核）
        run: |
          mkdir -p build/singbox
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o sb.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v$SINGBOX_VERSION/sing-box-$SINGBOX_VERSION-darwin-amd64.tar.gz"
          tar -xzf sb.tar.gz
          cp "$(find . -maxdepth 3 -type f -name sing-box | head -1)" build/singbox/sing-box
          chmod +x build/singbox/sing-box
      # 测试已移到 verify-macos-x64 job（并行跑）。本 job 只下载内核用于「内嵌」。
      - name: 构建 macOS（x64，Rosetta 整链）
        run: arch -x86_64 flutter build macos --release
      - name: 校验架构
        run: lipo build/macos/Build/Products/Release/MBox.app/Contents/MacOS/MBox -verify_arch x86_64
      - name: 内置 sing-box 内核（复用上面已下载的内核，不再重复下载）
        run: |
          APP="build/macos/Build/Products/Release/MBox.app"
          cp build/singbox/sing-box "$APP/Contents/MacOS/sing-box"
          chmod +x "$APP/Contents/MacOS/sing-box"
          lipo "$APP/Contents/MacOS/sing-box" -verify_arch x86_64
      - name: 打包 x64 DMG
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"; V="${V#v}"
          APP="build/macos/Build/Products/Release/MBox.app"; mkdir -p dist
          STAGE="build/dmg-stage-x64"; rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/MBox.app" && ln -s /Applications "$STAGE/Applications"
          cp scripts/uninstall_macos.command "$STAGE/uninstall.command" && chmod +x "$STAGE/uninstall.command"
          # 「已损坏，无法打开」的修复脚本：手动（浏览器）下载安装的用户一旦遇到
          # Gatekeeper 拦截，双击这个脚本即可清掉隔离属性
          cp scripts/fix_quarantine_macos.command "$STAGE/修复已损坏.command" && chmod +x "$STAGE/修复已损坏.command"
          codesign --force --deep -s - --entitlements macos/Runner/Release.entitlements "$STAGE/MBox.app"
          hdiutil create -volname MoneyFly -srcfolder "$STAGE" -ov -format UDZO "dist/MoneyFly-macos-x64-$V.dmg"
          cd dist && shasum -a 256 MoneyFly-macos-x64-$V.dmg > SHA256SUMS-macos-x64.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-macos-x64
          path: |
            dist/MoneyFly-macos-x64-*.dmg
            dist/SHA256SUMS-macos-x64.txt

  macos-universal:
    name: macOS universal（Flutter 原生双架构）
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('macos/Podfile') }}
          restore-keys: pods-${{ runner.os }}-
      - name: 依赖
        run: flutter pub get
      - name: 下载离线分流数据
        run: |
          bash tool/fetch_ruleset.sh
      - name: 下载 sing-box 内核（测试用，arm64）
        run: |
          mkdir -p build/singbox
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o sb.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v$SINGBOX_VERSION/sing-box-$SINGBOX_VERSION-darwin-arm64.tar.gz"
          tar -xzf sb.tar.gz
          cp "$(find . -maxdepth 3 -type f -name sing-box | head -1)" build/singbox/sing-box
          chmod +x build/singbox/sing-box
      # 只跑 e2e 组：全量测试由 arm64 job 覆盖，这里再跑一遍没有新信号
      - name: 测试（仅真实内核 e2e，串行）
        run: |
          export MONEYFLY_SINGBOX="$PWD/build/singbox/sing-box"
          flutter analyze
          flutter test --tags e2e --concurrency=1
      # Flutter 在 macOS release 直接产出 universal（arm64+x86_64 双架构），
      # 与 2.0.2 老办法一致
      - name: 构建 macOS release（universal）
        run: flutter build macos --release
      - name: 校验双架构
        run: lipo build/macos/Build/Products/Release/MBox.app/Contents/MacOS/MBox -verify_arch arm64 x86_64
      - name: 内置 sing-box 内核（universal：arm64 + amd64）
        run: |
          APP="build/macos/Build/Products/Release/MBox.app"
          mkdir -p sb && cd sb
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o sb-arm64.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v$SINGBOX_VERSION/sing-box-$SINGBOX_VERSION-darwin-arm64.tar.gz"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o sb-x64.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v$SINGBOX_VERSION/sing-box-$SINGBOX_VERSION-darwin-amd64.tar.gz"
          mkdir -p arm64 x64
          tar -xzf sb-arm64.tar.gz -C arm64
          tar -xzf sb-x64.tar.gz -C x64
          lipo -create "$(find arm64 -type f -name sing-box | head -1)" "$(find x64 -type f -name sing-box | head -1)" -output sing-box
          chmod +x sing-box
          cd ..
          cp sb/sing-box "$APP/Contents/MacOS/sing-box"
          chmod +x "$APP/Contents/MacOS/sing-box"
          lipo "$APP/Contents/MacOS/sing-box" -verify_arch arm64 x86_64
      - name: 打包 universal DMG
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"; V="${V#v}"
          APP="build/macos/Build/Products/Release/MBox.app"; mkdir -p dist
          STAGE="build/dmg-stage-universal"; rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/MBox.app" && ln -s /Applications "$STAGE/Applications"
          cp scripts/uninstall_macos.command "$STAGE/uninstall.command" && chmod +x "$STAGE/uninstall.command"
          # 「已损坏，无法打开」的修复脚本：手动（浏览器）下载安装的用户一旦遇到
          # Gatekeeper 拦截，双击这个脚本即可清掉隔离属性
          cp scripts/fix_quarantine_macos.command "$STAGE/修复已损坏.command" && chmod +x "$STAGE/修复已损坏.command"
          codesign --force --deep -s - --entitlements macos/Runner/Release.entitlements "$STAGE/MBox.app"
          hdiutil create -volname MoneyFly -srcfolder "$STAGE" -ov -format UDZO "dist/MoneyFly-macos-universal-$V.dmg"
          cd dist && shasum -a 256 MoneyFly-macos-universal-$V.dmg > SHA256SUMS-macos-universal.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
      # 停止线：dmg 只能在 macOS 上 hdiutil 挂载后真扫（Linux runner 扫不了，
      # 脚本会把"没扫到"当失败而不是当干净）。三个 macOS dmg 的 app payload
      # 同源，这里扫 universal 这一份作为代表。
      - name: 扫描产物（dmg 挂载后不得含测试/真实节点信息）
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python3 tool/scan_release_artifacts.py dist/MoneyFly-macos-universal-*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-macos-universal
          path: |
            dist/MoneyFly-macos-universal-*.dmg
            dist/SHA256SUMS-macos-universal.txt

  # ================= iOS：侧载 IPA（TrollStore / 自签） =================
  # 为什么产出「未签名」IPA：iOS 的 VPN 必须由 NetworkExtension 提供，依赖
  # packet-tunnel-provider entitlement —— 苹果只在付费开发者账号下签发。
  # 本项目走侧载分发（TrollStore / Sideloadly / AltStore），由设备侧安装器
  # 完成签名与授权。因此这里产出「结构完整、已内嵌 entitlements」的 IPA：
  #   Payload/Runner.app/PlugIns/PacketTunnel.appex  ← 内核（sing-box）跑在这里
  # ad-hoc 签名（codesign -s -）不带 Apple 描述文件，因此可以携带任意
  # entitlements，正是侧载工具能识别并沿用的形态。
  ios:
    name: iOS (unsigned IPA, sideload)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('macos/Podfile') }}
          restore-keys: pods-${{ runner.os }}-
      - name: 依赖
        run: flutter pub get
      - name: 下载离线分流数据（iOS 随扩展 bundle 分发）
        run: |
          bash tool/fetch_ruleset.sh
          ls -lh assets/rules/
      - name: 下载 iOS 内核框架（Mihomelib.xcframework）
        run: bash tool/fetch_singbox_ios.sh "$SINGBOX_VERSION"
      - name: 自检扩展 target 已就位
        run: |
          grep -q "PacketTunnel" ios/Runner.xcodeproj/project.pbxproj \
            || { echo "error: 缺少 PacketTunnel 扩展 target（先运行 ruby tool/ios_setup_tunnel_target.rb）"; exit 1; }
      - name: 校验 iOS 图标（仓库级，确保是品牌画稿而非 Flutter 默认模板）
        run: |
          # 用生成脚本重建一遍并与提交内容比对：不一致说明图标被改回默认模板
          # 或未随画稿更新（脚本内含与 Android 的像素一致性自检）
          # Pillow 在 macOS runner 上受 PEP 668 保护，装不上就跳过本步校验
          # （绝不能因为「装不上依赖」把构建判失败 —— 已踩过一次）
          if ! python3 -c "import PIL" 2>/dev/null; then
            python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null \
              || python3 -m pip install --quiet --user pillow 2>/dev/null || true
          fi
          if ! python3 -c "import PIL" 2>/dev/null; then
            echo "warning: 无 Pillow，跳过仓库级图标像素校验（IPA 内仍有尺寸断言）"
            exit 0
          fi
          python3 tool/gen_ios_icons.py
          # 与提交版本做**像素**比对（不比字节：Pillow/zlib 版本差异会改变
          # PNG 编码字节，但不是问题；像素不同才是真问题——例如被改回默认模板）
          python3 - <<'PYCHECK'
          import glob, io, os, subprocess, sys
          from PIL import Image
          bad = []
          for f in sorted(glob.glob('ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png')):
              old = subprocess.run(['git', 'show', f'HEAD:{f}'],
                                   capture_output=True).stdout
              if not old:
                  continue
              a = Image.open(io.BytesIO(old)).convert('RGB')
              b = Image.open(f).convert('RGB')
              if a.size != b.size or a.tobytes() != b.tobytes():
                  bad.append(os.path.basename(f))
          if bad:
              sys.exit('error: iOS 图标与品牌画稿像素不一致: ' + ', '.join(bad))
          print('✓ iOS 图标与提交版本像素一致（品牌画稿，非默认模板）')
          PYCHECK

      - name: 构建 iOS release（不签名）
        run: flutter build ios --release --no-codesign
      - name: 组装 IPA（含扩展 + 内嵌 entitlements）
        run: |
          set -e
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"; V="${V#v}"
          APP="build/ios/iphoneos/Runner.app"
          [ -d "$APP/PlugIns/PacketTunnel.appex" ] || {
            echo "error: Runner.app 内未嵌入 PacketTunnel.appex"; ls -la "$APP"; exit 1; }
          rm -rf Payload dist; mkdir -p Payload dist
          cp -R "$APP" Payload/
          # 签名：ad-hoc（codesign -s -），内嵌各自 entitlements。
          # 顺序「先内层 appex、后外层 app」。
          codesign --force -s - \
            --entitlements ios/PacketTunnel/PacketTunnel.entitlements \
            Payload/Runner.app/PlugIns/PacketTunnel.appex
          codesign --force -s - \
            --entitlements ios/Runner/Runner.entitlements \
            Payload/Runner.app
          zip -qry "dist/MoneyFly-ios-$V.ipa" Payload
          (cd dist && shasum -a 256 "MoneyFly-ios-$V.ipa" > SHA256SUMS-ios.txt && ls -lh)
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-ios
          path: |
            dist/MoneyFly-ios-*.ipa
            dist/SHA256SUMS-ios.txt

  # ================= 发布到 GitHub Releases =================
  release:
    name: 发布到 GitHub Releases
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, verify-macos, verify-macos-x64, verify-windows, android, android-aab, windows, macos-arm64, macos-x64, macos-universal, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # 必须先 checkout：扫描脚本（tool/scan_release_artifacts.py）在仓库里，
      # 本作业的其它步骤只用下载下来的产物，之前没有 checkout →
      # 最后一道闸报 "can't open file .../tool/scan_release_artifacts.py" 直接失败。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: 合并各平台校验和成一份 SHA256SUMS.txt
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          # Windows runner 的 sha256sum（Git Bash）会写成「二进制模式」——
          # 文件名前面多个 `*`。统一成 `<hash>  <name>` 两空格格式，免得同一份
          # 文件里两种写法混杂（`sha256sum -c` / `shasum -c` 两种都能吃，但看着乱）
          cat SHA256SUMS*.txt 2>/dev/null | sed 's/ \*/  /' | sort -k2 > SHA256SUMS.txt
          echo "── SHA256SUMS.txt 覆盖 $(wc -l < SHA256SUMS.txt) 个产物 ──"
          cat SHA256SUMS.txt

      # 合并后的最后一道闸：所有平台的产物都到齐了，在**创建 Release 之前**
      # 再扫一遍。dmg/exe 由各自的平台 job 负责，这里只扫 zip 类（本 runner 能真解包）。
      - name: 扫描产物（不得含测试/真实节点信息，闸在发布前）
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          python3 tool/scan_release_artifacts.py \
            dist/MoneyFly-android-*.apk \
            dist/MoneyFly-android-*.aab \
            dist/MoneyFly-ios-*.ipa \
            dist/MoneyFly-windows-x64-portable-*.zip

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          body: Fixed some issues.
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
