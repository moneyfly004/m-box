name: CI (Analyze + Test)

# 每次 push 到 main 或提 PR 时快速校验（不构建安装包，构建发布见 release.yml）
on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: '3.44.4'
  SINGBOX_VERSION: '1.14.4'

jobs:
  ci:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 依赖
        run: flutter pub get

      - name: 下载 sing-box 离线分流规则（assets 声明依赖，缺失会导致 test/构建失败）
        run: |
          bash tool/fetch_ruleset.sh
          ls -lh assets/rules/

      # 关键：把内核放到 test/gen_singbox_test.dart 会查找的路径
      # （singbox-bin/sing-box）。否则「真实内核 -t 校验」用例永远 skip，
      # 生成配置的正确性就没有回归防线（端口/CIDR/stack 之类的错误只能等
      # 用户侧内核启动失败才暴露）。
      - name: 下载 sing-box 内核（让真实内核 check 用例真正执行）
        run: |
          mkdir -p singbox-bin
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 \
            -o /tmp/sb.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SINGBOX_VERSION }}/sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          cp "$(find /tmp -maxdepth 2 -type f -name sing-box | head -1)" singbox-bin/sing-box
          chmod +x singbox-bin/sing-box
          ./singbox-bin/sing-box version

      - name: 校验
        run: |
          flutter analyze
          flutter test
        env:
          MBOX_SINGBOX: ${{ github.workspace }}/singbox-bin/sing-box
